[package]
name = "tapedeck"
version = "0.2.0"
edition = "2021"
description = "Script-driven dual-mode media recorder: declarative .roll scripts driving TUI (vhs) and native Wayland window recording"
license = "MIT"
repository = "https://github.com/cawa0505/tapedeck"
readme = "README.md"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
toml = "0.8"
ratatui = "0.26"
crossterm = "0.27"
anyhow = "1.0"
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui-image = { version = "1.0", optional = true }
image = { version = "0.25", optional = true }
nucleo = "0.5"
evdev = "0.13"
libc = "0.2"

[dev-dependencies]

[features]
default = []
preview = ["ratatui-image", "image"]

[[bin]]
name = "tapedeck"
path = "src/main.rs"